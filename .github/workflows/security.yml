name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 16 * * 1"

permissions:
  contents: read

jobs:
  dependency-and-plaintext:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: taiki-e/install-action@cargo-audit
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: cargo audit
      - run: pnpm scan:plaintext
      - run: pnpm lint
